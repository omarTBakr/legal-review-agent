# Runs the legal review worker with a persistent volume for its scratch space.
#
#   docker compose -f workers/legal_advice_worker/Docker/docker-compose.yml up -d --build
#   docker compose -f workers/legal_advice_worker/Docker/docker-compose.yml logs -f
#   docker compose -f workers/legal_advice_worker/Docker/docker-compose.yml down
#
# `down` keeps the volume; only `down -v` deletes it.

name: legal-review-agent-legal

services:
  legal-advice-worker:
    build:
      # the project root: the worker imports activities/, workflows/, utils/
      context: ../../..
      dockerfile: workers/legal_advice_worker/Docker/Dockerfile
    image: legal-review-agent-legal-advice-worker
    env_file:
      - ../../../.env
    environment:
      # localhost inside a container is the container itself
      TEMPORAL_HOST: temporal:7233
      # the container is the worker, so the API must not start a second one
      RUN_WORKER_IN_API: "false"
      # this worker runs analyze_batch, so it is the one that calls the model.
      # A local one listens on the *host*, which is not this container's
      # localhost; ignored when LLM_PROVIDER points at a hosted API.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      # what makes host.docker.internal resolve on Linux
      - "host.docker.internal:host-gateway"
    volumes:
      # survives `docker rm` and `compose down`; the PDFs and markdown written
      # by the activities outlive any single container
      - assets:/app/assets
    networks:
      - temporal-network
    restart: unless-stopped

volumes:
  assets:
    name: aiagent-legal_legal_assets

networks:
  temporal-network:
    # the network your Temporal stack already runs on
    external: true
